name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/wheelwise"
  DIRECT_URL: "postgresql://user:password@localhost:5432/wheelwise"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_cGxhY2Vob2xkZXItQ0kuY2xlcmsuYWNjb3VudHMuZGV2JA=="
  CLERK_SECRET_KEY: "sk_test_placeholder"
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
  GEMINI_API_KEY: "placeholder"
  ARCJET_KEY: "placeholder"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  prisma-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, prisma-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
